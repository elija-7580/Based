name: Based
options:
  bundleIdPrefix: com.friedrich-ulrich
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Based.xcconfig
  Release: Config/Based.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  BasedCore:
    path: Packages/BasedCore
  BasedBrain:
    path: Packages/BasedBrain
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
  FluidAudio:   # on-device speech recognition (Parakeet v3) and speaker diarization for meeting notes
    url: https://github.com/FluidInference/FluidAudio
    from: 0.18.3
targets:
  Based-macOS:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/macOS
    dependencies:
      - package: BasedCore
      - package: BasedBrain
        product: BasedBrain
      - package: SwiftTerm   # real terminal for Claude Code / Codex sessions (macOS only)
      - package: Sparkle     # self-updates for the downloadable DMG build (macOS only)
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: Based
        PRODUCT_BUNDLE_IDENTIFIER: $(BASED_BUNDLE_ID)
        INFOPLIST_FILE: App/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/macOS/Based$(BASED_ENTITLEMENTS_SUFFIX)$(BASED_AGENTS_SUFFIX).entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  Based-iOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
    dependencies:
      - package: BasedCore
      - package: BasedBrain
        product: BasedBrain
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: Based
        PRODUCT_BUNDLE_IDENTIFIER: $(BASED_BUNDLE_ID)
        INFOPLIST_FILE: App/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/iOS/Based$(BASED_ENTITLEMENTS_SUFFIX).entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  Based-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - App/UITests
    dependencies:
      - target: Based-macOS
    settings:
      base:
        TEST_TARGET_NAME: Based-macOS
        GENERATE_INFOPLIST_FILE: YES
  Based-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Based-iOS
    settings:
      base:
        TEST_TARGET_NAME: Based-iOS
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Based-macOS:
    build:
      targets:
        Based-macOS: all
        Based-macOS-UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Based-macOS-UITests
  Based-iOS:
    build:
      targets:
        Based-iOS: all
        Based-iOS-UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Based-iOS-UITests
