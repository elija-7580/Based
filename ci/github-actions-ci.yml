# Copy this file to .github/workflows/ci.yml (the agent integration cannot write workflow files):
#   github.com/elija-7580/Based → Add file → Create new file → name ".github/workflows/ci.yml" → paste → Commit.
# Afterwards GitHub builds and tests everything on each push; results appear in the "Actions" tab and as ✓ / ✗ next to each commit.
# Jobs: ts (TypeScript-Stack, ADR 0011: pnpm typecheck/lint/test inkl. Golden Fixtures, Playwright WebKit + Chromium)
#   · fixtures (BSD-168: die eingefrorene Swift-App liegt in legacy/ und ist nur noch Fixture-Quelle; BasedCore-Tests
#   prüfen, dass fixtures/ zum Swift-Code passt – im gepinnten swift:6.2-noble-Container, nur wenn legacy/ oder
#   fixtures/ sich ändern). Logs go to the ci-logs branch on pushes only (not for pull requests).
# Releases: Based Next baut .github/workflows/desktop.yml; die Swift-Releases (release.yml) sind abgeschaltet.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["replica/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # BSD-13: TypeScript-Stack (ADR 0011). Gleiche Prüfungen wie ci/typecheck/run-ts.sh --e2e.
  ts:
    name: TypeScript (pnpm, Playwright)
    runs-on: ubuntu-latest
    # BSD-168: der volle Playwright-Lauf (WebKit + Chromium) braucht inzwischen > 20 min
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, Lint, Tests (inkl. Fixture-Runner)
        run: |
          set -o pipefail
          { pnpm -r typecheck && pnpm lint && pnpm -r test; } 2>&1 | tee ts.log
      - name: Playwright (WebKit + Chromium)
        if: always()
        run: |
          set -o pipefail
          pnpm --filter @based/web exec playwright install --with-deps chromium webkit
          CI=1 pnpm --filter @based/web e2e 2>&1 | tee e2e.log
      - name: Publish log
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out
          { grep -E "error|FAIL|Tests |grün|portiert" ts.log | head -n 200; echo "--- e2e"; tail -n 40 e2e.log 2>/dev/null; } > /tmp/out/ts.txt || true
          bash scripts/publish-logs.sh ts

  # BSD-168: Swift-Code nur noch als Fixture-Quelle (legacy/). Läuft nur, wenn sich legacy/ oder fixtures/ ändern.
  fixtures:
    name: Golden-Fixture-Quelle (legacy/Swift/BasedCore, Linux, Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash   # der Container hat sonst sh (dash), das kein "set -o pipefail" kennt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Nur bei Änderungen an legacy/ oder fixtures/
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=HEAD~1; fi
          if git diff --name-only "$base" HEAD | grep -qE '^(legacy|fixtures)/' || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; echo "legacy/ und fixtures/ unverändert – übersprungen"; fi
      - if: steps.changed.outputs.run == '1'
        # DNS im Container fällt manchmal kurz aus: dreimal versuchen
        run: for i in 1 2 3; do apt-get update -qq && apt-get install -y -qq libsqlite3-dev && exit 0; sleep 15; done; exit 1
      - if: steps.changed.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: legacy/Swift/BasedCore/.build
          key: spm-core-6.2-${{ hashFiles('legacy/Swift/BasedCore/Package.swift', 'legacy/Swift/BasedCore/Package.resolved') }}
          restore-keys: spm-core-6.2-
      - name: Test
        if: steps.changed.outputs.run == '1'
        working-directory: legacy/Swift/BasedCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../../core-test.log
      - name: Publish log
        if: always() && github.event_name == 'push' && steps.changed.outputs.run == '1'
        run: |
          mkdir -p /tmp/out && grep -E "error:|failed|passed|Executed|Test run with" core-test.log | tail -n 80 > /tmp/out/core.txt || true
          bash scripts/publish-logs.sh core
