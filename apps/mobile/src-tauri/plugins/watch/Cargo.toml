[package]
name = "tauri-plugin-based-watch"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-based-watch"
description = "Empfang der Apple Watch App (apps/watch) in der iPhone-Hülle: WatchConnectivity in Swift, drei Befehle für die Oberfläche."

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
