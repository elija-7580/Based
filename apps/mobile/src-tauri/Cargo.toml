[package]
name = "based-mobile"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.77.2"
# ADR 0011: keine eigene Rust-Logik – nur die Tauri-Vorlage. Eigene Kiste (nicht apps/desktop), damit die Mac-App
# mit Menü, Updater und Beilage unberührt bleibt.

[lib]
name = "based_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
