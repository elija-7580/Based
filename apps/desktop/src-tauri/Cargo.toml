[package]
name = "based-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
# ADR 0011: keine eigene Rust-Logik – nur Tauri-Vorlage und offizielle Plugins.

[lib]
name = "based_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# Zwischenablage für das Based-Kontextmenü (Einfügen ohne die System-Blase von WKWebView).
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
# BSD-217: HTTP für den Notion-API-Import (kein CORS); erlaubte Adressen in capabilities/default.json.
tauri-plugin-http = "2"
# BSD-138: startet/stoppt die Beilage based-server (lokaler Server für CLI und Coding-Agenten); Start/Stopp steuert
# das Web-Frontend, erlaubt nur dieser eine Sidecar (capabilities/default.json).
tauri-plugin-shell = "2"
# BSD-319: „Problem melden“ – Bündel schreiben (nur ~/.config/based/reports) und im Finder zeigen.
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

# BSD-390: macOS Writing Tools aus – die WKWebViewConfiguration des Hauptfensters bekommt
# writingToolsBehavior = none (macOS 15+). Beide Kisten (MIT) kommen schon über wry/tauri mit, gleiche Versionen.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "WKWebViewConfiguration"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
