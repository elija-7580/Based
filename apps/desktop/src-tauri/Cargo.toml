[package]
name = "based-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
# ADR 0011: keine eigene Rust-Logik – nur Tauri-Vorlage und offizielle Plugins.

[lib]
name = "based_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
# BSD-217: HTTP für den Notion-API-Import (kein CORS); erlaubte Adressen in capabilities/default.json.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
