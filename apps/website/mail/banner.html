<!doctype html><html><head><meta charset="utf-8"><style>
/* Mail banner: 520x88 shown, rendered at 2x. Dark so it sits well in light and dark mail clients. */
@font-face{font-family:SG;src:url(../src/static/fonts/schibsted-grotesk-latin-wght-normal.woff2) format("woff2");font-weight:400 900}
html,body{margin:0;background:transparent}
.b{width:520px;height:88px;box-sizing:border-box;border-radius:14px;background:#232321;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);position:relative;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#F4F4F1;display:flex;align-items:center;padding:0 22px;gap:16px}
.sun{position:absolute;right:-40px;top:-130px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle closest-side,rgba(255,206,120,.30) 0%,rgba(250,180,100,.10) 50%,rgba(248,196,150,0) 100%)}
.mark{width:40px;height:40px;flex:0 0 auto}
.txt{display:flex;flex-direction:column;gap:5px;flex:1 1 auto;position:relative}
.h{font-family:SG;font-weight:800;font-size:23px;letter-spacing:-.035em;line-height:1}
.hl{background:linear-gradient(rgba(224,194,74,.75),rgba(224,194,74,.75)) no-repeat 0 88%/100% 36%}
.s{font-size:12.5px;color:#B5B4AE;white-space:nowrap}
.pill{position:relative;flex:0 0 auto;background:#F1DE8A;color:#1F1F1D;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:650}
</style></head><body><div class="b"><div class="sun"></div>
<img class="mark" src="../src/static/mark-dark.svg">
<div class="txt"><div class="h">Your data. <span class="hl">Based.</span></div><div class="s">Databases, docs and agents. Private by default.</div></div>
<div class="pill">Join the beta →</div>
</div></body></html>
