#
# Apple Watch App „Based“ (ADR 0011: Watch nativ, nur Aufnahme) und ihre Komplikation fürs Zifferblatt.
# XcodeGen: `xcodegen generate` erzeugt BasedWatch.xcodeproj (nicht eingecheckt). Bauen: docs/watch.md.
# Die Kennungen hängen an der iPhone-App (apps/mobile/src-tauri/tauri.conf.json, `identifier`): die Uhr-App ist
# deren Begleiter und heißt <identifier>.watchkitapp.
name: BasedWatch
options:
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    BASED_BUNDLE_ID: com.friedrich-ulrich.based.next
    TARGETED_DEVICE_FAMILY: "4"
targets:
  BasedWatch:
    type: application
    platform: watchOS
    sources:
      - App
      - Shared
    dependencies:
      - target: BasedWatchComplication
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Based
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BASED_BUNDLE_ID)
        NSMicrophoneUsageDescription: Based records your thought as a voice note and sends it to Based on your iPhone.
        # Die Aufnahme läuft weiter, wenn das Handgelenk sinkt.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: $(BASED_BUNDLE_ID).watchkitapp
            CFBundleURLSchemes: [basedwatch]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: BasedWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(BASED_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BasedWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - Complication
    info:
      path: Complication/Info.plist
      properties:
        CFBundleDisplayName: Based
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: BasedWatchComplication
        PRODUCT_BUNDLE_IDENTIFIER: $(BASED_BUNDLE_ID).watchkitapp.complication
schemes:
  BasedWatch:
    build:
      targets:
        BasedWatch: all
