# basednotes.app on a server that already has a shared edge Caddy (container "edge-caddy" on network "edge").
# Only the waitlist service runs here; edge-caddy serves the static site and proxies /api/*.
services:
  waitlist:
    image: node:22-alpine
    container_name: basednotes-waitlist
    restart: unless-stopped
    working_dir: /app
    command: ["node", "--no-warnings", "waitlist.mjs"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      WAITLIST_DB: /data/waitlist.sqlite
      BETA_DIR: /beta
      PORT: "8790"
      TZ: Europe/Vienna
      WAITLIST_RELOAD: "1"
      # BSD-631: read-only numbers at /api/waitlist/stats|check (empty = switched off)
      WAITLIST_STATS_TOKEN: ${WAITLIST_STATS_TOKEN:-}
      # BSD-632: problem reports → Based backlog in Notion (empty = reports are only stored under /data/reports)
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_BACKLOG_DATA_SOURCE: ${NOTION_BACKLOG_DATA_SOURCE:-}
    volumes:
      # the folder, not the file: a file mount keeps the old version after git replaces it (WAITLIST_RELOAD)
      - ../../../apps/website/server:/app:ro
      - waitlist-data:/data
      # BSD-553: the beta DMG, uploaded by the Desktop Beta workflow via rsync (ci/setup-beta-deploy.sh)
      - /srv/based-beta:/beta:ro
    networks: [edge]
volumes:
  waitlist-data:
    name: basednotes_waitlist-data
networks:
  edge:
    external: true
    name: edge
