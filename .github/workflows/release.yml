# Builds Based for Mac on every push to main and publishes it as a GitHub release:
#   Based-<version>.dmg / Based.dmg  → what people download
#   appcast.xml                      → installed copies of Based read it (Sparkle) and offer the update
# Needs one repository secret: SPARKLE_PRIVATE_KEY (Settings → Secrets and variables → Actions).
name: Release

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/**"
      - "Config/**"
      - "project.yml"
      - "scripts/release-mac.sh"
      - "scripts/sparkle_sign.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    name: Build DMG and publish
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version = number of commits; release notes = commits since the last tag

      - name: Check the signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Add the repository secret SPARKLE_PRIVATE_KEY (Settings → Secrets and variables → Actions). Without it updates can't be signed."
            exit 1
          fi

      - name: Select the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Tools
        run: |
          brew install xcodegen >/dev/null
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/release-mac.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat dist/version)
          gh release create "v$V" dist/Based-$V.dmg dist/Based.dmg dist/appcast.xml \
            --target "$GITHUB_SHA" --title "Based $V" --notes-file dist/notes.md --latest
