# Beta-Release (16.11.2026): „Based Beta“ – die Release-Linie für Tester (Branch beta, nur stabile Funktionen).
# Aktiv seit 16.11.2026 (BSD-454, auf Elijas Wunsch). Vorlage: ci/github-actions-desktop-beta.yml.
# Unterschiede zu desktop.yml (Based Next):
#   - läuft nur bei Pushes auf beta (und von Hand), baut mit BASED_CHANNEL=beta (shell/beta.ts, kein AI-Schalter)
#   - App „Based Beta“, Bundle-ID com.friedrich-ulrich.based.beta (tauri.beta.conf.json) – neben Based Next installierbar
#   - Version 0.2.<Lauf>, Pre-Release beta-v<Version>, fester Kanal beta-latest (latest.json für den Updater)
#   - Release Notes aus docs/beta/RELEASE_NOTES.md (oberster Abschnitt), nicht aus den Commits
name: Desktop Beta

on:
  push:
    branches: [beta]
  workflow_dispatch:

concurrency:
  group: desktop-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    name: Based Beta (DMG)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_NAME: Based Beta
      BASED_CHANNEL: beta
      TARGET: universal-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # BSD-168: Tags next-* für die Update-Notizen

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust (beide Mac-Architekturen)
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          # Laufende Nummer dieses Workflows: steigt mit jedem Lauf, damit der Updater neuere Versionen erkennt.
          V="0.2.${GITHUB_RUN_NUMBER}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Based Beta $V"

      - name: Build (.app, universal, ad hoc signiert)
        env:
          V: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Feedback 14. 11.: Ad hoc signiert verweigert macOS (App-Verwaltung) dem Updater das Ersetzen der App –
          # er fragt dann nach dem Admin-Passwort. Mit Developer-ID-Zertifikat (Secrets, docs/desktop.md) signiert
          # und notarisiert Tauri selbst; ohne Secrets bleibt es bei ad hoc.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          CONF="$RUNNER_TEMP/tauri.ci.json"
          UPD=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            UPD=true
          else
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – DMG ohne Update-Paket (siehe docs/desktop.md)."
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          SIGN='"-"'
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            SIGN="$(jq -Rn --arg id "$APPLE_SIGNING_IDENTITY" '$id')"
            echo "Developer ID: $APPLE_SIGNING_IDENTITY"
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
              printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
            else
              echo "::warning::Ohne APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_KEY_P8 wird nicht notarisiert."
              unset APPLE_API_KEY APPLE_API_ISSUER
            fi
          else
            echo "::warning::Kein Developer-ID-Zertifikat (APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY) – ad hoc signiert; Updates fragen nach dem Admin-Passwort."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER
          fi
          echo "{\"version\":\"$V\",\"bundle\":{\"createUpdaterArtifacts\":$UPD,\"macOS\":{\"signingIdentity\":$SIGN}}}" > "$CONF"
          # Beta-Overlay (Name, Bundle-ID, Updater-Kanal) und die Werte dieses Laufs zu einer Datei zusammenführen.
          jq -s '.[0] * .[1]' apps/desktop/src-tauri/tauri.beta.conf.json "$CONF" > "$CONF.beta" && mv "$CONF.beta" "$CONF"
          cat "$CONF"
          cd apps/desktop
          pnpm exec tauri build --target "$TARGET" --bundles app --config "$CONF"

      - name: Signatur prüfen
        run: |
          APP="apps/desktop/src-tauri/target/$TARGET/release/bundle/macos/$APP_NAME.app"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier" || true
          lipo -archs "$APP/Contents/MacOS/"*
          bash scripts/check-mac-signature.sh "$APP"

      - name: DMG
        env:
          V: ${{ steps.version.outputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          BUNDLE="apps/desktop/src-tauri/target/$TARGET/release/bundle/macos"
          mkdir -p dist "$RUNNER_TEMP/dmg"
          # Release Notes für Tester: oberster Abschnitt von docs/beta/RELEASE_NOTES.md (ohne die Überschrift).
          awk '/^## /{n++; next} n==1' docs/beta/RELEASE_NOTES.md | sed '/^$/N;/^\n$/D' > dist/notes.md
          [ -s dist/notes.md ] || echo "• Small fixes and improvements" > dist/notes.md
          ditto "$BUNDLE/$APP_NAME.app" "$RUNNER_TEMP/dmg/$APP_NAME.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO dist/Based-Beta.dmg
          hdiutil verify dist/Based-Beta.dmg
          if [ -f "$BUNDLE/$APP_NAME.app.tar.gz" ]; then
            cp "$BUNDLE/$APP_NAME.app.tar.gz" dist/Based-Beta.app.tar.gz
            cp "$BUNDLE/$APP_NAME.app.tar.gz.sig" dist/Based-Beta.app.tar.gz.sig
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/beta-v$V/Based-Beta.app.tar.gz"
            SIG="$(cat dist/Based-Beta.app.tar.gz.sig)"
            # Ein universelles Paket für beide Architekturen.
            jq -n --arg v "$V" --arg url "$URL" --arg sig "$SIG" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg notes "$(cat dist/notes.md)" \
              '{version:$v, notes:$notes, pub_date:$date, platforms:{
                 "darwin-aarch64":{signature:$sig,url:$url},
                 "darwin-x86_64":{signature:$sig,url:$url}}}' > dist/latest.json
            cat dist/latest.json
          fi
          ls -la dist
          # Mit Secret muss ein Update-Paket entstehen – sonst bekäme keine installierte Kopie das Update.
          if [ "$HAS_KEY" = "true" ] && [ ! -f dist/latest.json ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY ist gesetzt, aber es entstand kein latest.json (Signatur fehlgeschlagen?)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Based-Beta-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14

      - name: Release veröffentlichen
        # BSD-337: auch ein Lauf von Hand (workflow_dispatch) auf main veröffentlicht – sonst baut er nur.
        if: github.ref == 'refs/heads/beta' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          NOTES="Based Beta $V – Testversion für Mac (Apple Silicon und Intel).
          Installieren: Based-Beta.dmg öffnen, „Based Beta“ nach Programme ziehen. Anleitung: docs/beta/README.md.
          Läuft neben Based Next; eigene Daten. Commit ${GITHUB_SHA}.

          $(cat dist/notes.md)"
          ASSETS=(dist/Based-Beta.dmg)
          [ -f dist/Based-Beta.app.tar.gz ] && ASSETS+=(dist/Based-Beta.app.tar.gz dist/Based-Beta.app.tar.gz.sig)
          gh release create "beta-v$V" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "Based Beta $V" \
            --notes "$NOTES" --prerelease --latest=false

          # Fester Beta-Kanal für Download-Link und Updater.
          if ! gh release view beta-latest >/dev/null 2>&1; then
            gh release create beta-latest --target "$GITHUB_SHA" --title "Based Beta (neueste Version)" --prerelease --latest=false \
              --notes "Fester Link auf die neueste Based-Beta-DMG und latest.json für den Updater. Versionen: Releases beta-v<version>."
          fi
          UP=(dist/Based-Beta.dmg)
          [ -f dist/latest.json ] && UP+=(dist/latest.json)
          gh release upload beta-latest "${UP[@]}" --clobber
