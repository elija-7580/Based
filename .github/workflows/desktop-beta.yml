# Beta-Release (16.11.2026): „Based Notes Beta“ (bis BSD-514: „Based Beta“) – die Release-Linie für Tester (Branch beta, nur stabile Funktionen).
# Aktiv seit 16.11.2026 (BSD-454, auf Elijas Wunsch). Vorlage: ci/github-actions-desktop-beta.yml – beide gleich halten.
# BSD-433 (17.11.): Node-Signatur und verify-app. 18.11. (Beta-Agent): BSD-514 (Name) und BSD-542 (kurze Notizen) aus der Vorlage übernommen.
# Unterschiede zu desktop.yml (Based Next):
#   - läuft nur bei Pushes auf beta (und von Hand), baut mit BASED_CHANNEL=beta (shell/beta.ts, kein AI-Schalter)
#   - App „Based Notes Beta“, Bundle-ID com.friedrich-ulrich.based.beta (tauri.beta.conf.json) – neben Based Next installierbar
#   - BSD-514: nur der sichtbare Name ist neu. Bundle-ID, Tags beta-v<Version>/beta-latest und latest.json bleiben, damit
#     installierte Kopien („Based Beta.app“) das Update finden; Based-Beta.dmg wird weiter nach beta-latest geladen (alte Links).
#   - Version 0.2.<Lauf>, Pre-Release beta-v<Version>, fester Kanal beta-latest (latest.json für den Updater)
#   - Release Notes aus docs/beta/RELEASE_NOTES.md (oberster Abschnitt), nicht aus den Commits
#   - BSD-553 (18.11.): Die DMG geht per rsync auf den Website-Server (Download nur mit Einladung, basednotes.app/download?i=…),
#     nicht mehr an die GitHub-Releases. Ohne Secrets BETA_DEPLOY_HOST/USER/KEY bleibt der alte Weg (Warnung).
#     Update-Paket (.app.tar.gz) und latest.json bleiben unverändert an beta-v<Version>/beta-latest. Einrichtung: ci/setup-beta-deploy.sh
name: Desktop Beta

on:
  push:
    branches: [beta]
  workflow_dispatch:

concurrency:
  group: desktop-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    name: Based Notes Beta (DMG)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_NAME: Based Notes Beta
      BASED_CHANNEL: beta
      TARGET: universal-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # BSD-168: Tags next-* für die Update-Notizen

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust (beide Mac-Architekturen)
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          # Laufende Nummer dieses Workflows: steigt mit jedem Lauf, damit der Updater neuere Versionen erkennt.
          V="0.2.${GITHUB_RUN_NUMBER}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Based Notes Beta $V"

      - name: Build (.app, universal, ad hoc signiert)
        env:
          V: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Feedback 14. 11.: Ad hoc signiert verweigert macOS (App-Verwaltung) dem Updater das Ersetzen der App –
          # er fragt dann nach dem Admin-Passwort. Mit Developer-ID-Zertifikat (Secrets, docs/desktop.md) signiert
          # und notarisiert Tauri selbst; ohne Secrets bleibt es bei ad hoc.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          # BSD-433: Node und node-pty vor dem Bundle signieren (Hardened Runtime, src-tauri/node.entitlements);
          # mit Developer ID (APPLE_SIGNING_IDENTITY unten) für die Notarisierung, sonst ad hoc.
          BASED_SIGN_NODE: "1"
        run: |
          CONF="$RUNNER_TEMP/tauri.ci.json"
          UPD=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            UPD=true
          else
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – DMG ohne Update-Paket (siehe docs/desktop.md)."
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          SIGN='"-"'
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            SIGN="$(jq -Rn --arg id "$APPLE_SIGNING_IDENTITY" '$id')"
            echo "Developer ID: $APPLE_SIGNING_IDENTITY"
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
              printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
            else
              echo "::warning::Ohne APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_KEY_P8 wird nicht notarisiert."
              unset APPLE_API_KEY APPLE_API_ISSUER
            fi
          else
            echo "::warning::Kein Developer-ID-Zertifikat (APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY) – ad hoc signiert; Updates fragen nach dem Admin-Passwort."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER
          fi
          echo "{\"version\":\"$V\",\"bundle\":{\"createUpdaterArtifacts\":$UPD,\"macOS\":{\"signingIdentity\":$SIGN}}}" > "$CONF"
          # Beta-Overlay (Name, Bundle-ID, Updater-Kanal) und die Werte dieses Laufs zu einer Datei zusammenführen.
          jq -s '.[0] * .[1]' apps/desktop/src-tauri/tauri.beta.conf.json "$CONF" > "$CONF.beta" && mv "$CONF.beta" "$CONF"
          cat "$CONF"
          cd apps/desktop
          pnpm exec tauri build --target "$TARGET" --bundles app --config "$CONF"

      - name: Signatur prüfen
        run: |
          APP="apps/desktop/src-tauri/target/$TARGET/release/bundle/macos/$APP_NAME.app"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier" || true
          lipo -archs "$APP/Contents/MacOS/"*
          bash scripts/check-mac-signature.sh "$APP"
          # BSD-433/452: Node signiert (runtime + allow-jit), arm64 + x86_64, lokaler Server startet aus dem Bundle ohne PATH
          node apps/desktop/scripts/verify-app.mjs "$APP"

      - name: DMG
        env:
          V: ${{ steps.version.outputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          # Beta-Agent 18.11.: auch die DMG selbst mit Developer ID signieren, notarisieren und stapeln (die App darin ist
          # es seit beta-v0.2.5). Ohne Secrets bleibt sie unsigniert wie bisher.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          BUNDLE="apps/desktop/src-tauri/target/$TARGET/release/bundle/macos"
          mkdir -p dist "$RUNNER_TEMP/dmg"
          # Release Notes für Tester: oberster Abschnitt von docs/beta/RELEASE_NOTES.md (ohne die Überschrift).
          awk '/^## /{n++; next} n==1' docs/beta/RELEASE_NOTES.md | sed '/^$/N;/^\n$/D' > dist/notes.md
          [ -s dist/notes.md ] || echo "• Small fixes and improvements" > dist/notes.md
          # BSD-542: für den Updater (latest.json) nur die Kurzfassung – höchstens 3 Punkte à 80 Zeichen. Der Dialog der
          # installierten Beta 0.2.2–0.2.4 scrollt nicht; viele lange Zeilen schöben „Install and Restart“ aus dem Fenster.
          node apps/desktop/scripts/beta-notes.mjs docs/beta/RELEASE_NOTES.md --short > dist/notes-short.md || echo "• Small fixes and improvements" > dist/notes-short.md
          ditto "$BUNDLE/$APP_NAME.app" "$RUNNER_TEMP/dmg/$APP_NAME.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO dist/Based-Notes-Beta.dmg
          # Frisch geschriebene DMG ist kurz gesperrt („Resource temporarily unavailable“): bis zu 5 Versuche.
          for i in 1 2 3 4 5; do
            hdiutil verify dist/Based-Notes-Beta.dmg && break
            [ "$i" = 5 ] && exit 1
            sleep 5
          done
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            # Eigener Schlüsselbund (der des Build-Schritts ist weg), vorn in die Suchliste – wie sign-node.mjs.
            KC="$RUNNER_TEMP/based-dmg.keychain-db"; KCP="$(openssl rand -hex 16)"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dmg-cert.p12"
            security create-keychain -p "$KCP" "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p "$KCP" "$KC"
            security import "$RUNNER_TEMP/dmg-cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/dmg-cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp --keychain "$KC" dist/Based-Notes-Beta.dmg
            codesign -dv dist/Based-Notes-Beta.dmg 2>&1 | grep -E "Identifier|TeamIdentifier|Timestamp" || true
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
              P8="$RUNNER_TEMP/AuthKey_dmg_${APPLE_API_KEY}.p8"
              printf '%s' "$APPLE_API_KEY_P8" > "$P8"
              # Notarisierung der Hülle: scheitert sie, bleibt die signierte DMG (die App darin ist notarisiert) – Warnung.
              if xcrun notarytool submit dist/Based-Notes-Beta.dmg --key "$P8" --key-id "$APPLE_API_KEY" \
                   --issuer "$APPLE_API_ISSUER" --wait --timeout 20m; then
                xcrun stapler staple dist/Based-Notes-Beta.dmg
                spctl -a -t open --context context:primary-signature -vv dist/Based-Notes-Beta.dmg
                echo "DMG: signiert, notarisiert, gestapelt"
              else
                echo "::warning::DMG signiert, aber nicht notarisiert (notarytool). Die App darin ist notarisiert."
              fi
              rm -f "$P8"
            else
              echo "::warning::DMG signiert, aber ohne APPLE_API_* nicht notarisiert."
            fi
            security delete-keychain "$KC" || true
          fi
          # BSD-514: alter Name als Kopie, damit Links auf beta-latest/Based-Beta.dmg (Einladungen, alte Seiten) weiter gehen.
          cp dist/Based-Notes-Beta.dmg dist/Based-Beta.dmg
          if [ -f "$BUNDLE/$APP_NAME.app.tar.gz" ]; then
            cp "$BUNDLE/$APP_NAME.app.tar.gz" dist/Based-Notes-Beta.app.tar.gz
            cp "$BUNDLE/$APP_NAME.app.tar.gz.sig" dist/Based-Notes-Beta.app.tar.gz.sig
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/beta-v$V/Based-Notes-Beta.app.tar.gz"
            SIG="$(cat dist/Based-Notes-Beta.app.tar.gz.sig)"
            # Ein universelles Paket für beide Architekturen.
            jq -n --arg v "$V" --arg url "$URL" --arg sig "$SIG" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg notes "$(cat dist/notes-short.md)" \
              '{version:$v, notes:$notes, pub_date:$date, platforms:{
                 "darwin-aarch64":{signature:$sig,url:$url},
                 "darwin-x86_64":{signature:$sig,url:$url}}}' > dist/latest.json
            cat dist/latest.json
          fi
          ls -la dist
          # Mit Secret muss ein Update-Paket entstehen – sonst bekäme keine installierte Kopie das Update.
          if [ "$HAS_KEY" = "true" ] && [ ! -f dist/latest.json ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY ist gesetzt, aber es entstand kein latest.json (Signatur fehlgeschlagen?)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Based-Notes-Beta-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14

      - name: DMG auf den Server (BSD-553, nur für Eingeladene)
        id: deploy
        if: github.ref == 'refs/heads/beta' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          BETA_DEPLOY_HOST: ${{ secrets.BETA_DEPLOY_HOST }}
          BETA_DEPLOY_USER: ${{ secrets.BETA_DEPLOY_USER }}
          BETA_DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_KEY }}
          BETA_DEPLOY_KNOWN_HOSTS: ${{ secrets.BETA_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$BETA_DEPLOY_HOST" ] || [ -z "$BETA_DEPLOY_USER" ] || [ -z "$BETA_DEPLOY_KEY" ]; then
            echo "::warning::Secrets BETA_DEPLOY_HOST/USER/KEY fehlen – die DMG geht wie bisher öffentlich an die GitHub-Releases. Einrichten: ci/setup-beta-deploy.sh"
            echo "server=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # macOS bringt openrsync mit; für den Server (rrsync) das echte rsync nehmen.
          RSYNC=rsync
          if ! rsync --version 2>/dev/null | grep -q "rsync  version 3"; then
            brew install rsync >/dev/null && RSYNC="$(brew --prefix)/bin/rsync"
          fi
          umask 077
          KEY="$RUNNER_TEMP/beta-deploy-key"; KH="$RUNNER_TEMP/beta-known-hosts"
          printf '%s\n' "$BETA_DEPLOY_KEY" > "$KEY"
          if [ -n "$BETA_DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$BETA_DEPLOY_KNOWN_HOSTS" > "$KH"
          else
            echo "::warning::Ohne Secret BETA_DEPLOY_KNOWN_HOSTS wird der Host-Schlüssel des Servers ungeprüft übernommen."
            ssh-keyscan -T 15 "$BETA_DEPLOY_HOST" > "$KH" 2>/dev/null || true
          fi
          SSH="ssh -i $KEY -o IdentitiesOnly=yes -o UserKnownHostsFile=$KH -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20"
          # Der Schlüssel darf auf dem Server nur „rrsync -wo <Beta-Ordner>“: Zielpfade sind relativ zu diesem Ordner.
          # rsync schreibt in eine Temp-Datei und benennt erst am Ende um – laufende Downloads bekommen die alte Datei ganz.
          if "$RSYNC" -t -e "$SSH" dist/Based-Notes-Beta.dmg "$BETA_DEPLOY_USER@$BETA_DEPLOY_HOST:Based-Notes-Beta.dmg"; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "DMG auf dem Server – Download nur mit Einladung (basednotes.app/download?i=…)."
          else
            # Nicht öffentlich ausweichen: Updates erscheinen trotzdem, der Lauf wird am Ende rot.
            echo "::error::rsync auf $BETA_DEPLOY_HOST fehlgeschlagen – die DMG wird NICHT öffentlich hochgeladen. Updates gehen trotzdem raus."
            echo "server=failed" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$KEY"

      - name: Release veröffentlichen
        # BSD-337: auch ein Lauf von Hand (workflow_dispatch) auf main veröffentlicht – sonst baut er nur.
        if: github.ref == 'refs/heads/beta' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
          SERVER: ${{ steps.deploy.outputs.server }}
        run: |
          if [ "$SERVER" = "false" ]; then
            GET="Installieren: Based-Notes-Beta.dmg öffnen, „Based Notes Beta“ nach Programme ziehen."
          else
            GET="Download nur mit Einladung über basednotes.app/download; installierte Kopien aktualisieren sich selbst."
          fi
          NOTES="Based Notes Beta $V – Testversion für Mac (Apple Silicon und Intel).
          $GET Anleitung: docs/beta/README.md.
          Läuft neben Based Next; eigene Daten. Commit ${GITHUB_SHA}.

          $(cat dist/notes.md)"
          # BSD-553: die DMG nur noch ohne Server-Secrets öffentlich anhängen (alter Weg).
          ASSETS=()
          [ "$SERVER" = "false" ] && ASSETS+=(dist/Based-Notes-Beta.dmg)
          [ -f dist/Based-Notes-Beta.app.tar.gz ] && ASSETS+=(dist/Based-Notes-Beta.app.tar.gz dist/Based-Notes-Beta.app.tar.gz.sig)
          gh release create "beta-v$V" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "Based Notes Beta $V" \
            --notes "$NOTES" --prerelease --latest=false

          # Fester Beta-Kanal für Download-Link und Updater.
          if ! gh release view beta-latest >/dev/null 2>&1; then
            gh release create beta-latest --target "$GITHUB_SHA" --title "Based Notes Beta (neueste Version)" --prerelease --latest=false \
              --notes "latest.json für den Updater. Die DMG gibt es nur mit Einladung (basednotes.app/download). Versionen: Releases beta-v<version>."
          fi
          UP=()
          [ "$SERVER" = "false" ] && UP+=(dist/Based-Notes-Beta.dmg dist/Based-Beta.dmg)
          [ -f dist/latest.json ] && UP+=(dist/latest.json)
          if [ "${#UP[@]}" -gt 0 ]; then gh release upload beta-latest "${UP[@]}" --clobber; fi

      - name: Server-Upload fehlgeschlagen
        if: steps.deploy.outputs.server == 'failed'
        run: |
          echo "::error::Die DMG kam nicht auf den Server (Schritt „DMG auf den Server“). Updates sind veröffentlicht, Eingeladene laden noch die vorige DMG."
          exit 1
