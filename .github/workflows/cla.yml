# CLA für externe Beiträge (CLA.md). Unterschriften liegen im Branch cla-signatures (signatures/v1/cla.json).
# Wer im Pull Request „I have read the CLA Document and I hereby sign the CLA“ kommentiert, ist eingetragen.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/elija-7580/Based/blob/main/CLA.md
          branch: cla-signatures
          allowlist: elija-7580,dependabot[bot],github-actions[bot],claude[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before we can merge it, please read the
            [Contributor License Agreement](https://github.com/elija-7580/Based/blob/main/CLA.md)
            and sign it by posting the comment below. You keep the copyright of your work.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
