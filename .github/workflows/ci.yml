# Copy this file to .github/workflows/ci.yml (the agent integration cannot write workflow files):
#   github.com/elija-7580/Based → Add file → Create new file → name ".github/workflows/ci.yml" → paste → Commit.
# Afterwards GitHub builds and tests everything on each push; results appear in the "Actions" tab and as ✓ / ✗ next to each commit.
# Jobs: ts (TypeScript-Stack, ADR 0011: pnpm typecheck/lint/test inkl. Golden Fixtures, Playwright WebKit + Chromium)
#   · core (BasedCore tests, prüft auch, ob fixtures/ aktuell ist) · typecheck (BasedBrain tests + app type-check, macOS and iOS paths)
#   — both in the pinned swift:6.2-noble container with a SwiftPM cache — · apps (Debug build macOS + iOS Simulator)
#   · uitests (XCUITests on macOS, optional). Logs go to the ci-logs branch on pushes only (not for pull requests).
# The release build (DMG/Sparkle) is a separate, already active workflow (.github/workflows/release.yml); this file
# does not build releases.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["replica/**", "**/*.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      apps:
        description: "Build the macOS and iOS apps"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # BSD-13: TypeScript-Stack (ADR 0011). Gleiche Prüfungen wie ci/typecheck/run-ts.sh --e2e.
  ts:
    name: TypeScript (pnpm, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, Lint, Tests (inkl. Fixture-Runner)
        run: |
          set -o pipefail
          { pnpm -r typecheck && pnpm lint && pnpm -r test && BASED_PROPERTY_RECORDS=1 pnpm -r test; } 2>&1 | tee ts.log
      - name: Playwright (WebKit + Chromium)
        if: always()
        run: |
          set -o pipefail
          pnpm --filter @based/web exec playwright install --with-deps chromium webkit
          CI=1 pnpm --filter @based/web e2e 2>&1 | tee e2e.log
      - name: Publish log
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out
          { grep -E "error|FAIL|Tests |grün|portiert" ts.log | head -n 200; echo "--- e2e"; tail -n 40 e2e.log 2>/dev/null; } > /tmp/out/ts.txt || true
          bash scripts/publish-logs.sh ts

  # Linux jobs run in the pinned Swift 6.2 container — the same toolchain the night shift uses locally.
  core:
    name: BasedCore tests (Linux, Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash   # der Container hat sonst sh (dash), das kein "set -o pipefail" kennt
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: Swift/BasedCore/.build
          key: spm-core-6.2-${{ hashFiles('Swift/BasedCore/Package.swift', 'Swift/BasedCore/Package.resolved') }}
          restore-keys: spm-core-6.2-
      - name: Test
        working-directory: Swift/BasedCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../core-test.log
      - name: Publish log
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out && grep -E "error:|failed|passed|Executed|Test run with" core-test.log | tail -n 80 > /tmp/out/core.txt || true
          bash scripts/publish-logs.sh core

  typecheck:
    name: BasedBrain tests + app type-check (Linux, Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash   # der Container hat sonst sh (dash), das kein "set -o pipefail" kennt
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev python3
      - uses: actions/cache@v4
        with:
          path: |
            Swift/BasedCore/.build
            Swift/BasedBrain/.build
          key: spm-brain-6.2-${{ hashFiles('Swift/*/Package.swift', 'Swift/*/Package.resolved') }}
          restore-keys: spm-brain-6.2-
      - name: BasedBrain tests
        working-directory: Swift/BasedBrain
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../brain-test.log
      - name: Type-check App/Shared (macOS paths) against the SwiftUI / AppKit / MapKit stubs
        if: always()
        run: |
          set -o pipefail
          bash ci/typecheck/run.sh 2>&1 | tee typecheck.log
      - name: Type-check App/Shared (iOS paths)
        if: always()
        run: |
          set -o pipefail
          # run.sh --ios comes with BSD-95; until then this step only reports that it is skipped.
          if grep -q -- "--ios" ci/typecheck/run.sh; then
            TYPECHECK_OUT=/tmp/based-typecheck-ios bash ci/typecheck/run.sh --ios 2>&1 | tee typecheck-ios.log
          else
            echo "iOS type-check not available yet (ci/typecheck/run.sh has no --ios)" | tee typecheck-ios.log
          fi
      - name: Design-token audit (warning only, BSD-68)
        if: always()
        continue-on-error: true
        run: python3 scripts/design-audit.py --fail-above 700
      - name: Publish log
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out
          { grep -E "error:|failed|Executed|Test run with" brain-test.log | tail -n 60
            grep -E "error:|typecheck OK" typecheck.log | sed "s|/tmp/based-typecheck/src/||" | head -n 200
            echo "--- iOS"; grep -E "error:|typecheck OK|not available" typecheck-ios.log | sed "s|/tmp/based-typecheck-ios/ios/src/||" | head -n 200
          } > /tmp/out/typecheck.txt || true
          bash scripts/publish-logs.sh typecheck

  apps:
    name: Build apps (macOS + iOS)
    # Public repository: macOS runners are free, so the apps build on every push (add "[skip apps]" to a commit message to skip).
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip apps]')
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls /Applications | grep Xcode || true
          X=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)   # Swift 6.2 braucht Xcode 26
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen >/dev/null
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true
          python3 scripts/make_icons.py || true
          xcodegen generate
      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild -project Based.xcodeproj -scheme Based-macOS -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation   CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build-macos.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-macos.log
      - name: Build iOS app (Simulator)
        if: always()
        run: |
          set -o pipefail
          xcodebuild -project Based.xcodeproj -scheme Based-iOS -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation  CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-ios.log
      - name: Publish logs
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out
          for p in macos ios; do
            f=build-$p.log
            [ -f $f ] || continue
            { grep -E "BUILD (SUCCEEDED|FAILED)" $f | tail -n 1; grep -E "error:" $f | sed "s|$PWD/||" | sort -u | head -n 300
              # Fehler ohne "error:"-Zeile (Skript-Phasen, Paketauflösung, Signatur) stehen nur am Ende des Logs.
              if grep -q "BUILD FAILED" $f; then echo "--- Ende des Logs"; tail -n 80 $f | sed "s|$PWD/||"; fi
            } > /tmp/out/$p.txt
            grep -E "warning:" $f | sed "s|$PWD/||" | sort -u | head -n 200 > /tmp/out/$p-warnings.txt
          done
          bash scripts/publish-logs.sh apps

  uitests:
    name: macOS UI tests (optional)
    # XCUITests (App/UITests) need a logged-in GUI session; GitHub's macOS runners usually provide one, but the tests
    # are young — a failure here does not fail the run yet.
    needs: apps
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip apps]')
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)   # Swift 6.2 braucht Xcode 26
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen >/dev/null
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true
          python3 scripts/make_icons.py || true
          xcodegen generate
      - name: Run Based-macOS-UITests
        run: |
          set -o pipefail
          xcodebuild -project Based.xcodeproj -scheme Based-macOS -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation  CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" test 2>&1 | tee uitests-macos.log \
            | grep -E "error:|Test Case .* (passed|failed)|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" uitests-macos.log
      - name: Publish log
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out
          { grep -E "TEST (SUCCEEDED|FAILED)" uitests-macos.log | tail -n 1; grep -E "error:|Test Case .* failed|Executed" uitests-macos.log | sed "s|$PWD/||" | head -n 200; } > /tmp/out/uitests-macos.txt || true
          bash scripts/publish-logs.sh uitests
